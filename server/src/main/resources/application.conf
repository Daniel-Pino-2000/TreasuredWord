ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.application.bibleapp.server.ApplicationKt.module ]
    }
}

jwt {
    secret = "changeme-dev-secret"
    secret = ${?JWT_SECRET}
    issuer = "bibleapp-server"
    audience = "bibleapp-users"
    realm = "BibleApp"
}

# Google sign-in (#112). clientId is our Google Cloud *web* client ID: the audience of the ID tokens
# the app sends. It isn't a secret, but it belongs to the deployment, so it comes from the
# environment. Left empty, /auth/google answers GOOGLE_SIGN_IN_UNAVAILABLE.
google {
    clientId = ""
    clientId = ${?GOOGLE_CLIENT_ID}
    certsUrl = "https://www.googleapis.com/oauth2/v3/certs"
}

# Email (#154): codes to verify an address and reset a password, sent through the Gmail API from
# TreasuredWord's own Gmail account (free). The client secret and refresh token are secrets and live
# only in Render's environment, never here; server/DEPLOY.md says how to get them. from is that
# Gmail account with a name, e.g. "TreasuredWord <name@gmail.com>". With any of them empty, the
# endpoints that send email answer EMAIL_UNAVAILABLE.
email {
    gmailClientId = ""
    gmailClientId = ${?GMAIL_CLIENT_ID}
    gmailClientSecret = ""
    gmailClientSecret = ${?GMAIL_CLIENT_SECRET}
    gmailRefreshToken = ""
    gmailRefreshToken = ${?GMAIL_REFRESH_TOKEN}
    from = ""
    from = ${?EMAIL_FROM}
}

# Bible Helper (#123): the AI that answers, through an OpenAI-compatible API. For Cloudflare Workers
# AI's free plan, baseUrl is https://api.cloudflare.com/client/v4/accounts/<account id>/ai/v1 and
# model is @cf/google/gemma-4-26b-a4b-it (#122). The account ID and token belong to the deployment
# and live only in Render's environment, never here. With any of the three empty, the AI routes
# answer AI_UNAVAILABLE. disableThinking stays true for Gemma 4 and Qwen3; set it to false only for
# a provider that rejects chat_template_kwargs.
ai {
    baseUrl = ""
    baseUrl = ${?AI_BASE_URL}
    apiToken = ""
    apiToken = ${?AI_API_TOKEN}
    model = ""
    model = ${?AI_MODEL}
    disableThinking = true
    disableThinking = ${?AI_DISABLE_THINKING}
}

storage {
    jdbcUrl = "jdbc:postgresql://localhost:5433/bibleapp"
    jdbcUrl = ${?DATABASE_URL}
    driverClassName = "org.postgresql.Driver"
    user = "postgres"
    user = ${?DATABASE_USER}
    password = "postgres"
    password = ${?DATABASE_PASSWORD}
}
