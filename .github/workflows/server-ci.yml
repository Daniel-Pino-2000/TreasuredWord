name: Server CI

# Only runs on changes that could actually affect :server — the repo also has an :app module
# (Android/Compose) with its own separate build; this workflow deliberately never touches it.
on:
  push:
    branches: [main, ktorAppImplementation]
    paths:
      - "server/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - ".github/workflows/server-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    # The test suite (see server/src/test/.../TestSupport.kt) registers real users and hits
    # real routes against a real Postgres via testApplication — no H2/mocked DB — so CI needs
    # an actual Postgres to talk to, same as local dev's Docker container.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bibleapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run server tests
        # --configure-on-demand keeps Gradle from evaluating :app's build script (which needs
        # the Android SDK, not installed on this runner) just to run a :server-only task — :server
        # has no dependency on :app, so nothing about it is actually needed here.
        run: ./gradlew :server:test --configure-on-demand --console=plain
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/bibleapp
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          # Test-only secret — never the real one, which only ever lives in Render's encrypted
          # env vars (see server/DEPLOY.md) and each developer's own local environment.
          JWT_SECRET: ci-test-secret-not-for-production

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/test
