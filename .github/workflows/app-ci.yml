name: App CI

# Counterpart to server-ci.yml: only runs on changes that could affect the Android :app module.
# Root build files are included because the plugin versions :app builds with live there.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/app-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # AGP 8.10 needs JDK 17 to run; the app itself still targets Java 11 bytecode.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Handles Gradle caching (dependencies, wrapper, build cache), so setup-java's own
      # `cache: gradle` isn't used here. Held at v5 on purpose: v6 moved caching into a
      # proprietary component whose terms of use you accept just by upgrading.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests and build debug APK
        # No local.properties or secrets needed: the runner image ships the Android SDK and sets
        # ANDROID_HOME, and :app's build script reads no keys or URLs from the environment.
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: app-test-report
          path: app/build/reports/tests/testDebugUnitTest
